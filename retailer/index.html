<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reflex Retailer - New Delivery Request</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <!-- Top App Bar -->
    <nav class="bg-slate-950 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">

        <div class="flex items-center gap-3">

            <div class="bg-amber-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xl tracking-wider">
                REFLEX
            </div>

            <span class="text-xs font-bold text-slate-400 tracking-widest uppercase hidden sm:inline border-l border-slate-800 pl-3">
                Retailer Dashboard
            </span>

        </div>

        <div class="flex items-center gap-4">

            <div class="flex items-center gap-2 bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-full text-xs font-semibold border border-emerald-500/20">

                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>

                Online

            </div>

            <span class="text-sm text-slate-300 font-medium">
                Moi Avenue Retailers
            </span>

        </div>

    </nav>


    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-8">

        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-8">

            <div>

                <h1 class="text-2xl font-bold tracking-tight">
                    New Delivery Request
                </h1>

                <p class="text-sm text-slate-400 mt-1">
                    Submit a delivery for dispatch
                </p>

            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-3">

                <p class="text-xs text-slate-500 uppercase tracking-wider">
                    Retailer ID
                </p>

                <p class="text-sm font-bold text-amber-400">
                    retailer_01
                </p>

            </div>

        </div>


        <!-- Request Form -->
        <form
            id="deliveryForm"
            class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-lg space-y-5"
        >

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div class="space-y-1.5">

                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">
                        Customer Name
                    </label>

                    <input
                        type="text"
                        name="customerName"
                        placeholder="e.g. Amina Mohamed"
                        required
                        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition"
                    >

                </div>


                <div class="space-y-1.5">

                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">
                        Phone
                    </label>

                    <input
                        type="tel"
                        name="phone"
                        placeholder="+254 7XX XXX XXX"
                        required
                        class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition"
                    >

                </div>

            </div>


            <div class="space-y-1.5">

                <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">
                    Address
                </label>

                <input
                    type="text"
                    name="address"
                    placeholder="e.g. Moi Avenue, Shop #4"
                    required
                    class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition"
                >

            </div>


            <div class="space-y-1.5">

                <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">
                    Item Description
                </label>

                <input
                    type="text"
                    name="itemDescription"
                    placeholder="e.g. Electronics - Smartphone (1 unit)"
                    required
                    class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition"
                >

            </div>


            <button
                type="submit"
                id="submitButton"
                class="w-full bg-amber-500 hover:bg-amber-400 disabled:bg-slate-700 disabled:cursor-not-allowed text-slate-950 disabled:text-slate-400 font-bold text-sm px-5 py-3 rounded-xl transition active:scale-95"
            >
                Create Delivery Request
            </button>


            <p
                id="formStatus"
                class="hidden text-sm font-medium text-emerald-400 text-center"
            ></p>


            <p
                id="formError"
                class="hidden text-sm font-medium text-red-400 text-center"
            ></p>

        </form>


        <!-- Request History -->
        <div class="mt-10">

            <div class="flex justify-between items-center mb-4">

                <h2 class="text-lg font-bold tracking-tight">
                    Your Requests
                </h2>

                <span
                    id="requestCount"
                    class="text-xs text-slate-500"
                ></span>

            </div>


            <div
                id="requests-list"
                class="space-y-4"
            ></div>


            <!-- Loading -->
            <div
                id="loading-state"
                class="bg-slate-950 border border-slate-800 border-dashed rounded-2xl p-12 text-center text-slate-500"
            >

                <p class="text-sm font-medium text-slate-400">
                    Loading your requests…
                </p>

            </div>


            <!-- Empty -->
            <div
                id="requests-empty-state"
                class="hidden bg-slate-950 border border-slate-800 border-dashed rounded-2xl p-12 text-center text-slate-500"
            >

                <span class="text-4xl block mb-3">
                    📦
                </span>

                <p class="text-sm font-medium text-slate-400">
                    No requests yet
                </p>

                <p class="text-xs text-slate-600 mt-1">
                    Requests you submit will appear here.
                </p>

            </div>

        </div>


        <!-- Back -->
        <a
            href="../index.html"
            class="inline-block mt-6 text-sm text-slate-400 hover:text-amber-400 transition"
        >
            ← Back to Home
        </a>

    </main>


    <!-- Firebase Logic -->
    <script type="module">

        import {
            db,
            ref,
            push,
            set,
            onValue
        } from "../firebase.js";


        const RETAILER_ID = "retailer_01";


        const deliveryForm =
            document.getElementById("deliveryForm");

        const formStatus =
            document.getElementById("formStatus");

        const formError =
            document.getElementById("formError");

        const submitButton =
            document.getElementById("submitButton");

        const requestsList =
            document.getElementById("requests-list");

        const loadingState =
            document.getElementById("loading-state");

        const requestsEmptyState =
            document.getElementById("requests-empty-state");

        const requestCount =
            document.getElementById("requestCount");


        const STATUS_CLASSES = {

            OPEN:
                "bg-blue-500/10 text-blue-400 border border-blue-500/20",

            ASSIGNED:
                "bg-amber-500/10 text-amber-400 border border-amber-500/20",

            PICKED_UP:
                "bg-purple-500/10 text-purple-400 border border-purple-500/20",

            DELIVERED:
                "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"

        };


        /*
        ---------------------------------
        CREATE DELIVERY
        ---------------------------------
        */

        deliveryForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                formStatus.classList.add("hidden");
                formError.classList.add("hidden");

                submitButton.disabled = true;
                submitButton.textContent = "Submitting…";


                const formData =
                    new FormData(event.currentTarget);


                try {

                    const newDeliveryRef =
                        push(ref(db, "deliveries"));


                    const now = Date.now();


                    await set(newDeliveryRef, {

                        id: newDeliveryRef.key,

                        retailerId: RETAILER_ID,

                        customerName:
                            formData.get("customerName"),

                        phone:
                            formData.get("phone"),

                        address:
                            formData.get("address"),

                        itemDescription:
                            formData.get("itemDescription"),

                        status: "OPEN",

                        riderId: null,

                        createdAt: now,

                        updatedAt: now

                    });


                    deliveryForm.reset();

                    formStatus.textContent =
                        "Delivery request submitted successfully.";

                    formStatus.classList.remove("hidden");


                    setTimeout(() => {

                        formStatus.classList.add("hidden");

                    }, 3000);


                } catch (error) {

                    console.error(
                        "Error creating delivery:",
                        error
                    );

                    formError.textContent =
                        "Could not submit your request. Please try again.";

                    formError.classList.remove("hidden");

                } finally {

                    submitButton.disabled = false;

                    submitButton.textContent =
                        "Create Delivery Request";

                }

            }
        );


        /*
        ---------------------------------
        REAL-TIME REQUEST LIST
        ---------------------------------
        */

        onValue(
            ref(db, "deliveries"),
            (snapshot) => {

                loadingState.classList.add("hidden");

                const deliveries =
                    snapshot.val() || {};


                requestsList.innerHTML = "";


                const myRequests =
                    Object.values(deliveries)
                        .filter(
                            delivery =>
                                delivery.retailerId === RETAILER_ID
                        )
                        .sort(
                            (a, b) =>
                                (b.createdAt || 0) -
                                (a.createdAt || 0)
                        );


                if (myRequests.length === 0) {

                    requestsEmptyState.classList.remove("hidden");

                    requestCount.textContent = "";

                    return;

                }


                requestsEmptyState.classList.add("hidden");


                requestCount.textContent =
                    `${myRequests.length} request${myRequests.length > 1 ? "s" : ""}`;


                myRequests.forEach((delivery) => {

                    const card =
                        document.createElement("div");


                    const badgeClass =
                        STATUS_CLASSES[delivery.status] ||
                        STATUS_CLASSES.OPEN;


                    card.className =
                        "bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-lg";


                    card.innerHTML = `

                        <div class="flex flex-col gap-4">

                            <div class="flex items-center gap-2">

                                <span class="text-xs font-extrabold text-amber-400 bg-amber-500/10 px-2 py-1 rounded border border-amber-500/20">
                                    ${delivery.id}
                                </span>

                                <span class="text-xs font-bold px-2.5 py-1 rounded-md ${badgeClass}">
                                    ${delivery.status}
                                </span>

                            </div>


                            <div>

                                <h2 class="text-lg font-bold">
                                    ${delivery.customerName}
                                </h2>

                                <p class="text-sm text-slate-400 mt-2">
                                    📍 ${delivery.address}
                                </p>

                                <p class="text-sm text-slate-500 mt-1">
                                    📱 ${delivery.phone}
                                </p>

                                <p class="text-sm text-slate-500 mt-1">
                                    📦 ${delivery.itemDescription}
                                </p>

                            </div>


                            <div class="border-t border-slate-800 pt-3">

                                <p class="text-xs text-slate-500">

                                    Rider:

                                    <span class="text-slate-300">
                                        ${delivery.riderId || "Not yet assigned"}
                                    </span>

                                </p>

                            </div>

                        </div>

                    `;


                    requestsList.appendChild(card);

                });

            }
        );

    </script>

</body>
</html>
